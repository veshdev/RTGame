name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================
  # SERVER
  # ============================================================
  build-server:
    name: Build Server
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Server
        shell: pwsh
        working-directory: Server
        run: dotnet restore

      - name: Publish Server
        shell: pwsh
        working-directory: Server
        run: |
          dotnet publish `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o ../publish/server

      - name: Verify Server Artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/server")) {
            throw "Server publish directory was not created."
          }

          $files = Get-ChildItem "publish/server" -File -Recurse

          if ($files.Count -eq 0) {
            throw "Server publish directory is empty."
          }

          Write-Host "Server artifact contains $($files.Count) files."

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTGame-Server
          path: publish/server
          if-no-files-found: error


  # ============================================================
  # CLIENT
  # ============================================================
  build-client:
    name: Build Client
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Visual Studio / MSBuild
      # ----------------------------------------------------------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ----------------------------------------------------------
      # Setup vcpkg
      #
      # IMPORTANT:
      # The project currently has:
      #
      #   <VcpkgEnableManifest>true</VcpkgEnableManifest>
      #
      # but there is no Client/vcpkg.json.
      #
      # Therefore this workflow intentionally uses classic mode
      # and overrides VcpkgEnableManifest=false during MSBuild.
      # ----------------------------------------------------------
      - name: Setup vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"

          Write-Host "Installing vcpkg into:"
          Write-Host $vcpkgRoot

          git clone `
            --depth 1 `
            https://github.com/microsoft/vcpkg.git `
            $vcpkgRoot

          Push-Location $vcpkgRoot

          try {
            .\bootstrap-vcpkg.bat
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            throw "vcpkg.exe was not created."
          }

          "VCPKG_ROOT=$vcpkgRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          $vcpkgRoot | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

      # ----------------------------------------------------------
      # Install C++ dependencies
      #
      # Classic mode:
      #
      #   vcpkg\installed\x64-windows
      #
      # ----------------------------------------------------------
      - name: Install Client Dependencies
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_ROOT "vcpkg.exe"

          & $vcpkg install `
            sfml `
            imgui `
            imgui-sfml `
            hash-library `
            --triplet x64-windows `
            --clean-after-build

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg dependency installation failed."
          }

      # ----------------------------------------------------------
      # Verify dependency installation BEFORE MSBuild
      # ----------------------------------------------------------
      - name: Verify vcpkg Dependencies
        shell: pwsh
        run: |
          $include = Join-Path `
            $env:VCPKG_ROOT `
            "installed\x64-windows\include"

          $lib = Join-Path `
            $env:VCPKG_ROOT `
            "installed\x64-windows\lib"

          $bin = Join-Path `
            $env:VCPKG_ROOT `
            "installed\x64-windows\bin"

          $requiredHeaders = @(
            "$include\SFML\Graphics.hpp",
            "$include\SFML\Network.hpp",
            "$include\SFML\Audio.hpp",
            "$include\hash-library\sha256.h"
          )

          foreach ($header in $requiredHeaders) {
            if (-not (Test-Path $header)) {
              throw "Required header was not installed: $header"
            }

            Write-Host "FOUND: $header"
          }

          if (-not (Test-Path $lib)) {
            throw "vcpkg library directory does not exist: $lib"
          }

          if (-not (Test-Path $bin)) {
            throw "vcpkg binary directory does not exist: $bin"
          }

          Write-Host ""
          Write-Host "vcpkg dependencies verified successfully."

      # ----------------------------------------------------------
      # Integrate vcpkg into MSBuild
      #
      # This makes vcpkg's classic installation available to
      # Microsoft.Cpp.targets / MSBuild.
      # ----------------------------------------------------------
      - name: Integrate vcpkg with MSBuild
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg MSBuild integration failed."
          }

      # ----------------------------------------------------------
      # Clean old build output
      # ----------------------------------------------------------
      - name: Clean Client
        shell: pwsh
        run: |
          $project = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Client\Client.vcxproj"

          if (-not (Test-Path $project)) {
            throw "Client project was not found: $project"
          }

          # Remove possible old local output from checkout/cache.
          $paths = @(
            "Client\x64\Release",
            "Client\Release"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Remove-Item `
                -Path $path `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }

      # ----------------------------------------------------------
      # Build Client
      #
      # IMPORTANT:
      #
      # /p:VcpkgEnableManifest=false
      #
      # overrides the value currently present in Client.vcxproj:
      #
      # <VcpkgEnableManifest>true</VcpkgEnableManifest>
      #
      # This prevents MSBuild from looking for the missing
      # Client/vcpkg.json.
      #
      # vcpkg classic integration supplies the include/lib paths.
      # ----------------------------------------------------------
      - name: Build Client
        shell: pwsh
        run: |
          $project = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Client\Client.vcxproj"

          Write-Host "Building:"
          Write-Host $project

          & msbuild $project `
            /m `
            /v:minimal `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:VcpkgRoot="$env:VCPKG_ROOT" `
            /p:VcpkgEnableManifest=false `
            /p:VcpkgTriplet=x64-windows

          if ($LASTEXITCODE -ne 0) {
            throw "Client build failed."
          }

      # ----------------------------------------------------------
      # Locate executable
      # ----------------------------------------------------------
      - name: Locate Client Executable
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem `
            -Path "Client" `
            -Filter "*.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if ($exeFiles.Count -eq 0) {
            throw "Client executable was not produced."
          }

          Write-Host ""
          Write-Host "Client executable(s):"

          foreach ($exe in $exeFiles) {
            Write-Host $exe.FullName
          }

      # ----------------------------------------------------------
      # Prepare Client Artifact
      # ----------------------------------------------------------
      - name: Prepare Client Artifact
        shell: pwsh
        run: |
          $publish = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish\client"

          if (Test-Path $publish) {
            Remove-Item `
              $publish `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $publish `
            -Force | Out-Null

          # ------------------------------------------------------
          # Find the actual executable produced by MSBuild.
          # ------------------------------------------------------
          $exeFiles = Get-ChildItem `
            -Path "Client" `
            -Filter "*.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\x64\\Release\\" -or
              $_.FullName -match "\\Release\\"
            }

          if ($exeFiles.Count -eq 0) {
            throw "No Release executable found."
          }

          foreach ($exe in $exeFiles) {
            Copy-Item `
              -Path $exe.FullName `
              -Destination $publish `
              -Force

            Write-Host "Copied executable: $($exe.Name)"
          }

          # ------------------------------------------------------
          # Copy DLLs generated beside the executable.
          # ------------------------------------------------------
          $buildDirs = @(
            "Client\x64\Release",
            "Client\Release"
          )

          foreach ($dir in $buildDirs) {
            if (Test-Path $dir) {
              Get-ChildItem `
                -Path $dir `
                -Filter "*.dll" `
                -File `
                -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Copy-Item `
                    -Path $_.FullName `
                    -Destination $publish `
                    -Force

                  Write-Host "Copied client DLL: $($_.Name)"
                }
            }
          }

          # ------------------------------------------------------
          # Copy vcpkg runtime DLLs.
          # ------------------------------------------------------
          $vcpkgBin = Join-Path `
            $env:VCPKG_ROOT `
            "installed\x64-windows\bin"

          if (-not (Test-Path $vcpkgBin)) {
            throw "vcpkg bin directory not found: $vcpkgBin"
          }

          Get-ChildItem `
            -Path $vcpkgBin `
            -Filter "*.dll" `
            -File |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination $publish `
                -Force

              Write-Host "Copied vcpkg DLL: $($_.Name)"
            }

          # ------------------------------------------------------
          # Copy game assets.
          # ------------------------------------------------------
          $assets = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Client\assets"

          if (Test-Path $assets) {
            Copy-Item `
              -Path $assets `
              -Destination (Join-Path $publish "assets") `
              -Recurse `
              -Force

            Write-Host "Copied Client/assets."
          }
          else {
            Write-Warning "Client/assets directory was not found."
          }

          # ------------------------------------------------------
          # Print final artifact contents.
          # ------------------------------------------------------
          Write-Host ""
          Write-Host "========== CLIENT ARTIFACT =========="

          Get-ChildItem `
            -Path $publish `
            -Recurse `
            -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

          Write-Host "====================================="

      - name: Verify Client Artifact
        shell: pwsh
        run: |
          $publish = "publish\client"

          if (-not (Test-Path $publish)) {
            throw "Client artifact directory does not exist."
          }

          $exe = Get-ChildItem `
            -Path $publish `
            -Filter "*.exe" `
            -File `
            -ErrorAction SilentlyContinue

          if ($exe.Count -eq 0) {
            throw "Client artifact does not contain an executable."
          }

          Write-Host "Client artifact verified."

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTGame-Client
          path: publish/client
          if-no-files-found: error


  # ============================================================
  # RELEASE
  # ============================================================
  create-release:
    name: Create Release
    needs:
      - build-server
      - build-client

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify Downloaded Artifacts
        shell: bash
        run: |
          set -e

          test -d artifacts/RTGame-Server
          test -d artifacts/RTGame-Client

          echo "Server artifact:"
          find artifacts/RTGame-Server -type f

          echo ""
          echo "Client artifact:"
          find artifacts/RTGame-Client -type f

      - name: Archive Server
        shell: bash
        run: |
          set -e

          cd artifacts/RTGame-Server

          zip -r ../../RTGame-Server-Windows.zip .

      - name: Archive Client
        shell: bash
        run: |
          set -e

          cd artifacts/RTGame-Client

          zip -r ../../RTGame-Client-Windows.zip .

      - name: Verify Archives
        shell: bash
        run: |
          set -e

          test -f RTGame-Server-Windows.zip
          test -f RTGame-Client-Windows.zip

          echo "Created archives:"
          ls -lh \
            RTGame-Server-Windows.zip \
            RTGame-Client-Windows.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RTGame-Server-Windows.zip
            RTGame-Client-Windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
