name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-server:
    name: Build Server
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and Build Server
        run: |
          cd Server
          dotnet restore
          dotnet publish -c Release -r win-x64 --self-contained true -o ../publish/server

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTGame-Server
          path: publish/server

  build-client:
    name: Build Client
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV
          echo "$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_PATH

      - name: Install Dependencies
        run: |
          cd Client
          ..\vcpkg\vcpkg install sfml imgui imgui-sfml hash-library --triplet x64-windows
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Client (Manual vcpkg)
        run: |
          # Собираем, явно указывая пути к include и lib
          msbuild Client\Client.vcxproj /p:Configuration=Release /p:Platform=x64 /p:VcpkgRoot="$env:VCPKG_ROOT" /p:VcpkgEnabled=false /p:AdditionalIncludeDirectories="$env:VCPKG_ROOT\installed\x64-windows\include" /p:AdditionalLibraryDirectories="$env:VCPKG_ROOT\installed\x64-windows\lib" /p:IgnoreImportLibrary=true
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}

      - name: Prepare Client Artifact
        run: |
          mkdir publish\client
          # Копируем собранный EXE
          if exist "Client\x64\Release\*.exe" copy "Client\x64\Release\*.exe" publish\client\
          if exist "Client\Release\*.exe" copy "Client\Release\*.exe" publish\client\
          if exist "Client\*.exe" copy "Client\*.exe" publish\client\
          # Копируем DLL
          if exist "Client\x64\Release\*.dll" copy "Client\x64\Release\*.dll" publish\client\
          if exist "Client\Release\*.dll" copy "Client\Release\*.dll" publish\client\
          # Копируем DLL от vcpkg (если нужны)
          if exist "$env:VCPKG_ROOT\installed\x64-windows\bin" xcopy /E /I "$env:VCPKG_ROOT\installed\x64-windows\bin\*.dll" publish\client\
          # Копируем ассеты
          if exist Client\assets xcopy /E /I Client\assets publish\client\assets\
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTGame-Client
          path: publish/client

  create-release:
    name: Create Release
    needs: [build-server, build-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Archive Server
        run: |
          cd artifacts/RTGame-Server
          zip -r ../../RTGame-Server-Windows.zip .

      - name: Archive Client
        run: |
          cd artifacts/RTGame-Client
          zip -r ../../RTGame-Client-Windows.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RTGame-Server-Windows.zip
            RTGame-Client-Windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
